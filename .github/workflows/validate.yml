name: validate

# Structure-only check: parses the marketplace and both plugin manifests and
# validates every SKILL.md's frontmatter. Never publishes anything.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace (schema, duplicate names, path traversal)
        run: claude plugin validate . --strict

      - name: Validate every plugin in the catalog
        run: |
          set -euo pipefail
          # Discover plugins from marketplace.json, so a newly added plugin is
          # validated automatically with no change to this workflow.
          mapfile -t dirs < <(node -e "require('./.claude-plugin/marketplace.json').plugins.forEach(p=>console.log(p.source.replace(/^\.\//,'')))")
          if [ "${#dirs[@]}" -eq 0 ]; then echo "no plugins in marketplace.json"; exit 1; fi
          for dir in "${dirs[@]}"; do
            echo "· validating ./${dir}"
            claude plugin validate "./${dir}" --strict
          done
