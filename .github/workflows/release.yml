name: release

# Fully automatic. On every push to main, each plugin whose manifest `version`
# has not been released yet is built and published — no manual tagging. Bump a
# plugin's version, merge, and CI cuts the release. Merges that don't change a
# version publish nothing (the version's tag already exists).
#
# Each zip has the plugin DIRECTORY at its top level
# (e.g. redmine-superpower/.claude-plugin/plugin.json), which is the shape
# `claude --plugin-dir ./x.zip` and `--plugin-url https://.../x.zip` expect.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate before packaging
        run: |
          claude plugin validate . --strict
          claude plugin validate ./plugins/redmine-superpower --strict
          claude plugin validate ./plugins/redmine-superpower-quorum --strict

      - name: Publish any plugin whose version isn't released yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for plugin in redmine-superpower redmine-superpower-quorum; do
            version="$(node -p "require('./plugins/${plugin}/.claude-plugin/plugin.json').version")"
            tag="${plugin}-v${version}"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "· ${tag} already released — skipping"
              continue
            fi
            echo "· publishing ${tag}"
            # zip from inside plugins/ so the plugin directory sits at the zip root
            ( cd plugins && zip -qr "../dist/${plugin}-v${version}.zip" "$plugin" )
            unzip -l "dist/${plugin}-v${version}.zip" | head -n 8
            # `gh release create` creates the tag at this commit
            gh release create "$tag" "dist/${plugin}-v${version}.zip" \
              --title "$tag" \
              --generate-notes
          done
